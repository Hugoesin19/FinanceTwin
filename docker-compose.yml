services:
  financetwin:
    build: .
    ports:
      - "8000:8000"
    environment:
      FINANCETWIN_DB: /data/financetwin.sqlite
      PORT: "8000"
    volumes:
      - financetwin_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  financetwin_data:
