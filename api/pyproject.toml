[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financetwin-api"
version = "0.1.0"
description = "Finance Twin minimal FastAPI (local, €0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "financetwin-engine",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["financetwin_api*"]

[tool.setuptools.package-data]
financetwin_api = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
