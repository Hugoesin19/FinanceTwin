[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financetwin-engine"
version = "0.1.0"
description = "Finance Twin deterministic financial engine (library only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["financetwin_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
